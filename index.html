:root{--bg:#100e1d;--panel:rgba(29,25,52,.82);--text:#f7f5ff;--muted:#aaa4c2;--accent:#b9ff66;--violet:#8d6cff;--danger:#ff6b7a;--line:rgba(255,255,255,.10)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(circle at 50% 0,#292247 0,#151126 38%,#0f0d1b 78%);overflow-x:hidden}

button,input{font:inherit}.app{width:min(1080px,calc(100% - 32px));min-height:100vh;margin:auto;padding:34px 0;display:flex;align-items:center;justify-content:center;position:relative;z-index:1}.screen{width:100%;animation:rise .4s ease both}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.home{text-align:center;max-width:760px}.kicker{display:inline-flex;border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:999px;padding:8px 13px;color:#d9d5e8;font-size:.84rem;font-weight:800;margin-bottom:28px}
.logo-box{width:58px;height:58px;margin:0 auto 18px;border-radius:17px;background:var(--accent);color:#151126;display:grid;place-items:center;font-size:30px;font-weight:1000;transform:rotate(-5deg);box-shadow:0 14px 34px rgba(185,255,102,.18)}
.brand{font-size:clamp(4rem,12vw,7.4rem);line-height:.9;letter-spacing:-.075em;margin:0;font-weight:950;background:linear-gradient(#fff,#c9c3df);-webkit-background-clip:text;color:transparent}.hero{font-size:clamp(1.05rem,2.4vw,1.32rem);color:var(--muted);max-width:610px;margin:24px auto 32px;line-height:1.55}.hero strong{color:var(--accent)}
.primary,.secondary,.answer,.difficulty{border:0;cursor:pointer;transition:.18s}.primary{background:var(--accent);color:#151126;font-weight:900;padding:16px 25px;border-radius:15px;box-shadow:0 12px 30px rgba(185,255,102,.11)}.primary:hover{transform:translateY(-2px);filter:brightness(1.04)}.primary.large{min-width:220px;font-size:1.05rem}.secondary{background:transparent;border:1px solid var(--line);color:#fff;padding:14px 18px;border-radius:14px}.secondary:hover{background:rgba(255,255,255,.05)}
.features{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:52px;text-align:left}.feature{background:rgba(255,255,255,.045);border:1px solid var(--line);padding:18px;border-radius:18px}.feature span{display:block;color:var(--accent);font-weight:900;font-size:.77rem;margin-bottom:8px;text-transform:uppercase;letter-spacing:.08em}
.card{width:min(700px,100%);background:var(--panel);border:1px solid var(--line);border-radius:26px;padding:clamp(24px,5vw,42px);backdrop-filter:blur(18px);box-shadow:0 30px 80px rgba(0,0,0,.34)}.eyebrow{color:var(--accent);font-size:.78rem;font-weight:900;text-transform:uppercase;letter-spacing:.14em}.card h1{font-size:clamp(2rem,5vw,3.1rem);letter-spacing:-.04em;margin:10px 0 8px}.card p{color:var(--muted);line-height:1.55}.field{margin:28px 0 22px}.field label{font-weight:800;display:block;margin-bottom:9px}.field input{width:100%;padding:16px 17px;border-radius:14px;border:1px solid var(--line);background:#141126;color:#fff;outline:none}.field input:focus{border-color:rgba(185,255,102,.65);box-shadow:0 0 0 4px rgba(185,255,102,.08)}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:24px}

function extraWrong(word,used){

  return {prompt:q[0],options:shuffle(options)};
}
function home(){s={name:"",diff:"",qs:[],i:0,ok:0,score:0,lock:false};app.innerHTML=`<section class="screen home"><div class="kicker">10 retos · 3 niveles · mejora jugando</div><div class="logo-box">L</div><h1 class="brand">Lexitify</h1><p class="hero">Un juego que te ayuda a <strong>dominar la ortografía</strong>. Elige la respuesta correcta, suma puntos y escala en el ranking.</p><button class="primary large" id="play">Jugar ahora →</button><div class="features"><div class="feature"><span>01 · Practica</span><b>Ejercicios breves y claros</b></div><div class="feature"><span>02 · Progresa</span><b>Tres dificultades a tu ritmo</b></div><div class="feature"><span>03 · Compite</span><b>Supera tu mejor puntuación</b></div></div></section>`;play.onclick=nameScreen}
function nameScreen(){app.innerHTML=`<section class="screen card"><div class="eyebrow">Antes de empezar</div><h1>¿Cómo te llamamos?</h1><p>Tu nombre aparecerá en la tabla de puntuaciones de este dispositivo.</p><form id="nf"><div class="field"><label for="u">Nombre de usuario</label><input id="u" maxlength="20" autocomplete="off" placeholder="Ej: PalabraNinja" required></div><div class="actions"><button type="button" class="secondary" id="back">Volver</button><button class="primary">Continuar →</button></div></form></section>`;back.onclick=home;nf.onsubmit=e=>{e.preventDefault();let v=u.value.trim();if(v){s.name=v.slice(0,20);difficulty()}};setTimeout(()=>u.focus(),50)}
function difficulty(){app.innerHTML=`<section class="screen card"><div class="eyebrow">Hola, ${esc(s.name)}</div><h1>Elige tu desafío</h1><p>Cada partida toma 10 ejercicios al azar. Cuanto más difícil, más puntos ganas por acierto.</p><div class="difficulty-grid">${Object.entries(D).map(([k,d])=>`<button class="difficulty" data-k="${k}"><span class="emoji">${d.e}</span><h3>${d.l}</h3><p>${d.d}</p><span class="pts">+${d.p} pts por acierto</span></button>`).join("")}</div><div class="actions"><button class="secondary" id="back">← Cambiar nombre</button></div></section>`;document.querySelectorAll(".difficulty").forEach(b=>b.onclick=()=>start(b.dataset.k));back.onclick=nameScreen}
function start(k){s.diff=k;s.qs=shuffle(Q[k]).slice(0,10);s.i=0;s.ok=0;s.score=0;s.lock=false;s.ready=false;s.current=null;question()}
function question(){
  const d=D[s.diff],q=prepareQuestion(s.qs[s.i]);s.current=q;s.lock=false;s.ready=false;
  app.innerHTML=`<section class="screen game"><div class="topbar"><div class="mini-brand">Lex<i>itify</i></div><div class="player">${esc(s.name)} · ${d.l}</div></div><div class="progress-row"><div class="track"><div class="fill" style="width:${s.i*10}%"></div></div><div class="counter">${s.i+1}/10</div></div><div class="qcard"><div class="qmeta"><span class="badge">${d.e} ${d.l}</span><span class="score">${s.score} pts</span></div><h2 class="question">${esc(q.prompt)}</h2><div class="answers">${q.options.map((a,i)=>`<button class="answer" data-i="${i}" disabled><span class="letter">${"ABCDEF"[i]}</span><span>${esc(a.text)}</span></button>`).join("")}</div><div id="feed" class="feedback">Lee las 6 opciones…</div></div></section>`;
  document.querySelectorAll(".answer").forEach(b=>b.onclick=()=>answer(+b.dataset.i));
  setTimeout(()=>{if(!s.current||s.lock)return;s.ready=true;document.querySelectorAll(".answer").forEach(b=>b.disabled=false);const f=document.querySelector("#feed");if(f)f.textContent="";},650);
}
function answer(x){
  if(s.lock||!s.ready)return;
  s.lock=true;
  const q=s.current,bs=[...document.querySelectorAll(".answer")],correctIndex=q.options.findIndex(o=>o.correct);
  bs.forEach(b=>b.disabled=true);
  bs[correctIndex].classList.add("correct");
  if(x===correctIndex){
    s.ok++;s.score+=D[s.diff].p;feed.className="feedback good";feed.textContent=`¡Correcto! +${D[s.diff].p} puntos`;
  }else{
    bs[x].classList.add("wrong");feed.className="feedback bad";feed.textContent=`Casi. La respuesta correcta era “${q.options[correctIndex].text}”.`;
  }
  setTimeout(()=>{s.i++;s.lock=false;s.ready=false;s.current=null;s.i>=10?finish():question()},1100);
}
function msg(n){return n===10?["🏆","¡Eres increíble!","Puntuación perfecta. Las palabras no se te escapan."]:n>=7?["✨","¡Casi lo tenías!","Muy buen resultado. Una partida más y puedes superarte."]:n>=4?["📚","¡Sigue reforzando!","Vas por buen camino. Cada intento entrena tu escritura."]:["✍️","¡A estudiar!","Hoy detectaste qué puedes mejorar. Inténtalo otra vez."]}
async function finish(){
  let d=D[s.diff],m=msg(s.ok);
  app.innerHTML=`<section class="screen result"><div class="result-head"><div class="result-emoji">${m[0]}</div><h1>${m[1]}</h1><p>${m[2]}</p><div class="summary">${s.ok}/10 correctas · ${d.l}</div></div><div class="result-grid"><div class="score-panel"><h3>Tu puntuación</h3><div class="big-score">${s.score}</div><p>puntos obtenidos con ${s.ok} respuestas correctas.</p><p id="position"><strong>Posición:</strong> calculando…</p></div><div class="board-panel"><h3>🏅 Top 10 real</h3><div id="board" class="board-list"><div class="note">Guardando tu resultado y cargando jugadores…</div></div></div></div><div class="result-actions"><button class="secondary" id="same">Repetir nivel</button><button class="primary" id="again">Jugar de nuevo →</button></div><div id="ranknote" class="note">El ranking es compartido entre todos los jugadores.</div></section>`;
  same.onclick=()=>start(s.diff);again.onclick=home;
  try{
    const res=await fetch('/api/leaderboard',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:s.name,score:s.score,correct:s.ok,difficulty:s.diff})});
    const data=await res.json();
    if(!res.ok) throw new Error([data.error,data.detail].filter(Boolean).join(' — ')||'No se pudo guardar el ranking');

    // Confirmación independiente: vuelve a leer Redis después de guardar.
    const verifyRes=await fetch('/api/leaderboard?t='+Date.now(),{cache:'no-store'});
    const verify=await verifyRes.json();
    if(!verifyRes.ok) throw new Error([verify.error,verify.detail].filter(Boolean).join(' — ')||'Se guardó el resultado, pero no se pudo verificar el ranking');

    position.innerHTML=`<strong>Posición por mejor puntaje:</strong> #${data.rank ?? '—'}`;
    board.innerHTML=verify.top.length?verify.top.map((r,i)=>`<div class="board-row ${r.name.toLowerCase()===s.name.toLowerCase()?"me":""}"><span class="rank">#${i+1}</span><span class="board-name">${esc(r.name)}</span><span class="board-score">${r.score} pts</span></div>`).join(''):`<div class="note">Aún no hay jugadores en el ranking.</div>`;
    ranknote.textContent=data.bestScore>s.score?`Esta partida: ${s.score} pts · Tu récord guardado: ${data.bestScore} pts`:'✓ Tu puntuación quedó guardada y verificada en el ranking global.';
  }catch(err){
    console.error('Leaderboard:',err);
    position.innerHTML='<strong>Posición:</strong> no disponible';
    board.innerHTML='<div class="note">No se pudo guardar/cargar el ranking global.</div>';
    ranknote.textContent='Error: '+String(err.message||err);
  }
}
home();
</script></body></html>
