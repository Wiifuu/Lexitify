.hero{font-size:clamp(1.05rem,2.4vw,1.32rem);color:var(--muted);max-width:610px;margin:28px auto 34px;padding:0 12px;line-height:1.6;}
.hero strong{color:var(--accent);}

.card{width:min(700px,100%);background:var(--panel);border:1px solid var(--line);border-radius:26px;padding:clamp(24px,5vw,42px);backdrop-filter:blur(18px);box-shadow:0 30px 80px rgba(0,0,0,.34)}.eyebrow{color:var(--accent);font-size:.78rem;font-weight:900;text-transform:uppercase;letter-spacing:.14em}.card h1{font-size:clamp(2rem,5vw,3.1rem);letter-spacing:-.04em;margin:10px 0 8px}.card p{color:var(--muted);line-height:1.55}.field{margin:28px 0 22px}.field label{font-weight:800;display:block;margin-bottom:9px}.field input{width:100%;padding:16px 17px;border-radius:14px;border:1px solid var(--line);background:#141126;color:#fff;outline:none}.field input:focus{border-color:rgba(185,255,102,.65);box-shadow:0 0 0 4px rgba(185,255,102,.08)}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:24px}
.difficulty-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:26px}.difficulty{background:#161329;border:1px solid var(--line);border-radius:18px;padding:22px 16px;color:#fff;text-align:left}.difficulty:hover{transform:translateY(-3px);border-color:rgba(185,255,102,.42);background:#1b1731}.difficulty .emoji{font-size:1.6rem}.difficulty h3{font-size:1.05rem;margin:13px 0 5px}.difficulty p{font-size:.82rem;margin:0;line-height:1.4}.pts{color:var(--accent);font-weight:900;font-size:.78rem;margin-top:14px;display:block}

function shuffle(x){
  x=[...x];
  for(let i=x.length-1;i;i--){
    let j=Math.floor(Math.random()*(i+1));
    [x[i],x[j]]=[x[j],x[i]];
  }
  return x;
}

function extraWrong(word,used){
  const variants=[];
  const noAccent=word.normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  if(noAccent!==word) variants.push(noAccent);
  const swaps=[[/b/g,"v"],[/v/g,"b"],[/c/g,"s"],[/s/g,"c"],[/g/g,"j"],[/j/g,"g"],[/ll/g,"y"],[/y/g,"ll"],[/qu/g,"k"]];
  for(const [a,b] of swaps){
    const v=word.replace(a,b);
    if(v!==word)variants.push(v);
  }
  if(word.length>4){
    variants.push(word.slice(0,2)+word[2]+word.slice(2));
    variants.push(word.slice(0,Math.floor(word.length/2))+word.slice(Math.floor(word.length/2)+1));
  }
  variants.push("h"+word);
  for(const v of variants){
    if(v && !used.has(v.toLowerCase()))return v;
  }
  let n=1,v;
  do{v=word+"h".repeat(n++)}while(used.has(v.toLowerCase()));
  return v;
}

function getQuestionMode(difficulty){
  const r=Math.random();
  if(difficulty==="normal") return r<0.55 ? "fill" : "spelling";
  if(difficulty==="dificil") return r<0.85 ? "fill" : "spelling";
  if(difficulty==="extremo") return "fill";
  return "spelling";
}

function prepareSpellingQuestion(q){
  const correct=q[1][q[2]];
  const used=new Set(q[1].map(v=>String(v).toLowerCase()));
  const options=q[1].map((text,i)=>({text,correct:i===q[2]}));
  while(options.length<6){
    const v=extraWrong(correct,used);
    used.add(v.toLowerCase());
    options.push({text:v,correct:false});
  }
  return {type:"spelling",prompt:q[0],options:shuffle(options)};
}

function makeFillQuestion(item,difficulty){
  const answers=[...item.answers];
  let pool=[...answers,...(item.distractors||[])];

  if(difficulty==="extremo"){
    const used=new Set(pool.map(x=>x.toLowerCase()));
    const extra=shuffle(EXTREME_DISTRACTORS).filter(w=>!used.has(w.toLowerCase()));
    // 8 respuestas correctas de 32 opciones = 25% exacto, dentro del rango pedido 20-35%.
    while(pool.length<32 && extra.length) pool.push(extra.shift());
    pool=pool.slice(0,32);
  }else{
    const target=difficulty==="dificil" ? 18 : 12;
    const used=new Set(pool.map(x=>x.toLowerCase()));
    const source=shuffle([...(Q[difficulty]||[])]).map(q=>q[1][q[2]]);
    for(const w of source){
      if(pool.length>=target) break;
      if(!used.has(String(w).toLowerCase())){
        used.add(String(w).toLowerCase());
        pool.push(w);
      }
    }
  }

  return {
    type:"fill",
    sentence:item.sentence,
    answers,
    options:shuffle(pool),
    difficulty
  };
}

function buildRound(k){
  if(k==="extremo"){
    return shuffle(EXTREME_BANK).map(x=>makeFillQuestion(x,"extremo"));
  }

  const modeCount=k==="normal" ? 6 : k==="dificil" ? 9 : 0;
  if(k==="facil") return shuffle(Q.facil).slice(0,10).map(prepareSpellingQuestion);

  const fills=shuffle(FILL_BANK[k]).slice(0,modeCount).map(x=>makeFillQuestion(x,k));
  const spellings=shuffle(Q[k]).slice(0,10-modeCount).map(prepareSpellingQuestion);
  return shuffle([...fills,...spellings]);
}

      <div class="extreme-rule"><strong>1 error = fin de la partida.</strong> No hay segunda oportunidad.</div>
      <div class="extreme-rule"><strong>+1 punto</strong> por cada oración completada correctamente.</div>
      <div class="extreme-rule">Hay un banco de <strong>150 preguntas</strong>. La partida continúa hasta que falles o completes las 150.</div>
      <div class="extreme-rule">Cada reto tiene <strong>8 espacios</strong> y <strong>32 opciones</strong>.</div>
      <div class="extreme-rule">Debes elegir las palabras <strong>en orden, del primer espacio al último</strong>, y luego confirmar.</div>
      <div class="extreme-rule">Tu <strong>racha de aciertos</strong> se guarda en un leaderboard exclusivo de Extremo.</div>
    </div>
    <div class="actions">
      <button class="secondary" id="cancelExtreme">Volver</button>
      <button class="primary" id="beginExtreme">Acepto el reto →</button>
    </div>
  </div>`;
  document.body.appendChild(modal);
  modal.querySelector("#cancelExtreme").onclick=()=>modal.remove();
  modal.querySelector("#beginExtreme").onclick=()=>{
    modal.remove();
    start("extremo");
  };
  modal.onclick=e=>{if(e.target===modal)modal.remove();};
}

function start(k){
  s.diff=k;
  s.qs=buildRound(k);
  s.i=0;s.ok=0;s.score=0;s.lock=false;s.ready=false;s.current=null;s.chosen=[];
  question();
}

function renderFillSentence(q){
  let n=0;
  return q.sentence.replace(/___/g,()=>{
    const value=s.chosen[n]||"";
    const active=n===s.chosen.length;
    const out=`<span class="blank-slot ${value?"filled":""} ${active?"active":""}" data-slot="${n}">${value?esc(value):"("+ (n+1) +")"}</span>`;
    n++;
    return out;
  });
}

function question(){
  const d=D[s.diff],q=s.qs[s.i];
  s.current=q;s.lock=false;s.ready=false;s.chosen=[];

  if(q.type==="fill"){
    app.innerHTML=`<section class="screen game"><div class="topbar"><div class="mini-brand">Lex<i>itify</i></div><div class="player">${esc(s.name)} · ${d.l}</div></div><div class="progress-row"><div class="track"><div class="fill" style="width:${s.diff==="extremo"?Math.min(100,(s.i/150)*100):s.i*10}%"></div></div><div class="counter">${s.diff==="extremo"?"Racha "+s.score+" · "+(s.i+1)+"/150":(s.i+1)+"/10"}</div></div><div class="qcard"><div class="qmeta"><span class="badge">${d.e} ${d.l} · Completar</span><span class="score">${s.score} pts</span></div><div id="sentence" class="fill-sentence">${renderFillSentence(q)}</div><div class="fill-help">Selecciona las palabras <strong>en orden, desde el primer espacio hasta el último</strong>. ${q.options.length} opciones · ${q.answers.length} espacios.</div><div id="wordbank" class="word-bank">${q.options.map((w,i)=>`<button class="word-option" data-i="${i}">${esc(w)}</button>`).join("")}</div><div class="fill-controls"><button type="button" class="secondary" id="undo" disabled>← Borrar última</button><button type="button" class="primary" id="checkBtn">Siguiente →</button></div><div id="feed" class="feedback"></div></div></section>`;
    document.querySelectorAll(".word-option").forEach(b=>b.addEventListener("click",()=>chooseWord(+b.dataset.i)));
    document.querySelector("#undo").addEventListener("click",undoWord);
    document.querySelector("#checkBtn").addEventListener("click",checkFill);
    s.ready=true;
    return;
  }

  app.innerHTML=`<section class="screen game"><div class="topbar"><div class="mini-brand">Lex<i>itify</i></div><div class="player">${esc(s.name)} · ${d.l}</div></div><div class="progress-row"><div class="track"><div class="fill" style="width:${s.i*10}%"></div></div><div class="counter">${s.i+1}/10</div></div><div class="qcard"><div class="qmeta"><span class="badge">${d.e} ${d.l} · Ortografía</span><span class="score">${s.score} pts</span></div><h2 class="question">${esc(q.prompt)}</h2><div class="answers">${q.options.map((a,i)=>`<button class="answer" data-i="${i}" disabled><span class="letter">${"ABCDEF"[i]}</span><span>${esc(a.text)}</span></button>`).join("")}</div><div id="feed" class="feedback">Lee las 6 opciones…</div></div></section>`;
  document.querySelectorAll(".answer").forEach(b=>b.onclick=()=>answer(+b.dataset.i));
  setTimeout(()=>{
    if(!s.current||s.lock)return;
    s.ready=true;
    document.querySelectorAll(".answer").forEach(b=>b.disabled=false);
    const f=document.querySelector("#feed");
    if(f)f.textContent="";
  },650);
}

function chooseWord(index){
  if(s.lock||!s.ready)return;
  const q=s.current;
  if(s.chosen.length>=q.answers.length)return;
  const btn=document.querySelector(`.word-option[data-i="${index}"]`);
  if(!btn||btn.disabled)return;
  s.chosen.push(q.options[index]);
  btn.disabled=true;
  btn.dataset.chosen="1";
  document.querySelector("#sentence").innerHTML=renderFillSentence(q);
  document.querySelector("#undo").disabled=s.chosen.length===0;
}

function undoWord(){
  if(s.lock||!s.chosen.length)return;
  const word=s.chosen.pop();
  const btn=[...document.querySelectorAll(".word-option")].find(b=>b.dataset.chosen==="1" && b.textContent===word);
  if(btn){btn.disabled=false;delete btn.dataset.chosen;}
  document.querySelector("#sentence").innerHTML=renderFillSentence(s.current);
  document.querySelector("#undo").disabled=s.chosen.length===0;
}

function checkFill(){
  if(s.lock||!s.ready)return;
  const q=s.current;
  const feedEl=document.querySelector("#feed");

  if(!q){
    if(feedEl){
      feedEl.className="feedback bad";
      feedEl.textContent="No se pudo leer este ejercicio. Intenta nuevamente.";
    }
    return;
  }

  if(s.chosen.length!==q.answers.length){
    if(feedEl){
      feedEl.className="feedback bad";
      feedEl.textContent=`Selecciona ${q.answers.length} palabras antes de continuar. Llevas ${s.chosen.length}.`;
    }
    return;
  }

  s.lock=true;
  const correct=s.chosen.every((w,i)=>w===q.answers[i]);
  document.querySelectorAll(".word-option").forEach(b=>b.disabled=true);
  document.querySelector("#undo").disabled=true;
  document.querySelector("#checkBtn").disabled=true;

  if(correct){
    s.ok++;
    s.score+=D[s.diff].p;
    feedEl.className="feedback good";
    feedEl.textContent=s.diff==="extremo"
      ? `✓ Correcto. Racha: ${s.score}`
      : `¡Secuencia perfecta! +${D[s.diff].p} puntos`;

    setTimeout(()=>{
      s.i++;s.lock=false;s.ready=false;s.current=null;s.chosen=[];
      if(s.diff==="extremo"){
        s.i>=s.qs.length ? finish(true) : question();
      }else{
        s.i>=10 ? finish() : question();
      }
    },1200);
  }else{
    feedEl.className="feedback bad";
    feedEl.textContent=`Secuencia correcta: ${q.answers.join(" · ")}`;

    if(s.diff==="extremo"){
      finish(false);
    }else{
      setTimeout(()=>{
        s.i++;s.lock=false;s.ready=false;s.current=null;s.chosen=[];
        s.i>=10?finish():question();
      },1800);
    }
  }
}

function answer(x){
  if(s.lock||!s.ready)return;
  s.lock=true;
  const q=s.current,bs=[...document.querySelectorAll(".answer")],correctIndex=q.options.findIndex(o=>o.correct);
  bs.forEach(b=>b.disabled=true);
  bs[correctIndex].classList.add("correct");
  const feedEl=document.querySelector("#feed");
  if(x===correctIndex){
    s.ok++;s.score+=D[s.diff].p;
    feedEl.className="feedback good";
    feedEl.textContent=`¡Correcto! +${D[s.diff].p} puntos`;
  }else{
    bs[x].classList.add("wrong");
    feedEl.className="feedback bad";
    feedEl.textContent=`Casi. La respuesta correcta era “${q.options[correctIndex].text}”.`;
  }
  setTimeout(()=>{
    s.i++;s.lock=false;s.ready=false;s.current=null;
    s.i>=10?finish():question();
  },1100);
}

function msg(n){
  return n===10?["🏆","¡Eres increíble!","¡10 de 10! Puntuación perfecta."]:
    n>=7?["✨","¡Casi lo tenías, suerte para la próxima vez!",`${n}/10 respuestas correctas. Estuviste muy cerca.`]:
    n>=4?["📚","¡Falta reforzar esa escritura!",`${n}/10 respuestas correctas. Sigue practicando para mejorar.`]:
    ["✍️","¡A estudiar!",`${n}/10 respuestas correctas. Practica un poco más y vuelve a intentarlo.`];
}

async function finish(extremeCompleted=false){
  let d=D[s.diff];
  let m;
  if(s.diff==="extremo"){
    m=extremeCompleted
      ? ["🏆","¡Hazaña perfecta!","Completaste las 150 preguntas del modo Extremo sin cometer un solo error."]
      : ["💀","Fin de la racha",`Un error termina el modo Extremo. Lograste ${s.score} ${s.score===1?"punto":"puntos"} antes de caer.`];
  }else{
    m=msg(s.ok);
  }
  app.innerHTML=`<section class="screen result"><div class="result-head"><div class="result-emoji">${m[0]}</div><h1>${m[1]}</h1><p>${m[2]}</p><div class="summary">${s.diff==="extremo" ? s.score+" puntos · racha máxima" : s.ok+"/10 correctas"} · ${d.l}</div></div><div class="result-grid"><div class="score-panel"><h3>Tu puntuación</h3><div class="big-score">${s.score}</div><p>${s.diff==="extremo" ? "Cada respuesta correcta vale 1 punto. La partida termina al primer error." : "puntos obtenidos con "+s.ok+" respuestas correctas."}</p><p id="position"><strong>Posición:</strong> calculando…</p></div><div class="board-panel"><h3>🏅 Top 10 ${d.l}</h3><div id="board" class="board-list"><div class="note">Guardando tu resultado y cargando jugadores…</div></div></div></div><div class="result-actions"><button class="secondary" id="same">Repetir nivel</button><button class="primary" id="again">Jugar de nuevo →</button></div><div id="ranknote" class="note">Ranking independiente para el nivel ${d.l}.</div></section>`;
  same.onclick=()=>start(s.diff);
  again.onclick=home;
  try{
    const res=await fetch('/api/leaderboard',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:s.name,score:s.score,correct:s.ok,difficulty:s.diff})});
    const data=await res.json();
    if(!res.ok) throw new Error([data.error,data.detail].filter(Boolean).join(' — ')||'No se pudo guardar el ranking');

    const verifyRes=await fetch('/api/leaderboard?difficulty='+encodeURIComponent(s.diff)+'&t='+Date.now(),{cache:'no-store'});
    const verify=await verifyRes.json();
    if(!verifyRes.ok) throw new Error([verify.error,verify.detail].filter(Boolean).join(' — ')||'Se guardó el resultado, pero no se pudo verificar el ranking');

    position.innerHTML=`<strong>Posición por mejor puntaje:</strong> #${data.rank ?? '—'}`;
    board.innerHTML=verify.top.length?verify.top.map((r,i)=>`<div class="board-row ${r.name.toLowerCase()===s.name.toLowerCase()?"me":""}"><span class="rank">#${i+1}</span><span class="board-name">${esc(r.name)}</span><span class="board-score">${r.score} pts</span></div>`).join(''):`<div class="note">Aún no hay jugadores en el ranking.</div>`;
    ranknote.textContent=data.bestScore>s.score?`Esta partida: ${s.score} pts · Tu récord guardado: ${data.bestScore} pts`:`✓ Tu puntuación quedó guardada en el ranking ${d.l}.`;
  }catch(err){
    console.error('Leaderboard:',err);
    position.innerHTML='<strong>Posición:</strong> no disponible';
    board.innerHTML='<div class="note">No se pudo guardar/cargar el ranking de este nivel.</div>';
    ranknote.textContent='Error: '+String(err.message||err);
  }
}

home();
</script>
